	<meta property="og:type" content="website" />

	<meta property="og:locale" content="ja_JP" />
	<meta property="og:title" content="Neon RenderPipeline Lab — WebXR × WebGPU" />
	<meta property="og:description" content="VR ゴーグルの中で、Bloom から Film Grain までポストプロセスをリアルタイムに調整。three.js r187 の RenderPipeline を目ごとに描くステレオ対応デモ。" />

	<style>
		html, body { margin: 0; height: 100%; background: #0b0418; overflow: hidden; font-family: system-ui, sans-serif; color: #f3e9ff; }
		canvas { display: block; }
		#info {
			position: absolute; top: 12px; left: 12px; max-width: min(520px, calc(100vw - 340px));
			padding: 12px 16px; border-radius: 12px; background: rgba(16, 6, 34, 0.72);
			border: 1px solid rgba(255, 79, 216, 0.45); font-size: 13px; line-height: 1.55; pointer-events: none;
		}
		#info h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: 0.04em; }
		#info .ok { color: #7dffb0; }
		#info .ng { color: #ff7d9b; }
		#info ul { margin: 6px 0 0; padding-left: 18px; color: #c9b8ec; }
		@media (max-width: 720px) { #info { max-width: calc(100vw - 48px); font-size: 12px; } }
	</style>
</head>
<body>
	<div id="info">
		<h1>NEON RENDERPIPELINE LAB</h1>
		<div id="status">Initializing WebGPU…</div>
		<ul>
			<li>Desktop: drag to orbit · use the left panel in the scene or the GUI on the right</li>
			<li>VR: point a controller ray at the panel, trigger = click / drag sliders</li>
			<li>VR: squeeze = summon panel · left stick = move · right stick = snap turn</li>
		</ul>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
